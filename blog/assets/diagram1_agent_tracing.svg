<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6770"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3621"/>
    </marker>
  </defs>

  <rect width="1160" height="560" fill="#FFFFFF"/>
  <text x="30" y="42" font-size="22" font-weight="bold" fill="#1B3139">First-notice-of-loss claims agent with multimodal tracing</text>

  <!-- Column 1: Claim evidence -->
  <rect x="30" y="80" width="230" height="440" rx="10" fill="#F7F7F5" stroke="#DCDCDC"/>
  <text x="145" y="110" font-size="15" font-weight="bold" fill="#1B3139" text-anchor="middle">Claim intake</text>

  <rect x="52" y="130" width="186" height="78" rx="8" fill="#FFFFFF" stroke="#B9C2C8"/>
  <text x="145" y="160" font-size="13" font-weight="bold" fill="#1B3139" text-anchor="middle">Damage photos</text>
  <text x="145" y="180" font-size="11.5" fill="#5B6770" text-anchor="middle">JPEG, 1&#8211;n per claim</text>

  <rect x="52" y="224" width="186" height="78" rx="8" fill="#FFFFFF" stroke="#B9C2C8"/>
  <text x="145" y="254" font-size="13" font-weight="bold" fill="#1B3139" text-anchor="middle">Scanned claim form</text>
  <text x="145" y="274" font-size="11.5" fill="#5B6770" text-anchor="middle">Automobile Loss Notice</text>

  <rect x="52" y="318" width="186" height="78" rx="8" fill="#FFFFFF" stroke="#B9C2C8"/>
  <text x="145" y="348" font-size="13" font-weight="bold" fill="#1B3139" text-anchor="middle">Claimant description</text>
  <text x="145" y="368" font-size="11.5" fill="#5B6770" text-anchor="middle">&#8220;Just a little fender</text>
  <text x="145" y="384" font-size="11.5" fill="#5B6770" text-anchor="middle">bender&#8230;&#8221;</text>

  <!-- Column 2: Agent -->
  <rect x="330" y="80" width="330" height="440" rx="10" fill="#EEF3F8" stroke="#B9C2C8"/>
  <text x="495" y="110" font-size="15" font-weight="bold" fill="#1B3139" text-anchor="middle">Claims agent  (traced spans)</text>

  <rect x="352" y="128" width="286" height="56" rx="8" fill="#FFFFFF" stroke="#2272B4" stroke-width="1.5"/>
  <text x="495" y="151" font-size="12.5" font-weight="bold" fill="#2272B4" text-anchor="middle">ingest_evidence</text>
  <text x="495" y="170" font-size="11" fill="#5B6770" text-anchor="middle">stores every photo + form on the trace</text>

  <rect x="352" y="198" width="286" height="56" rx="8" fill="#FFFFFF" stroke="#2272B4" stroke-width="1.5"/>
  <text x="495" y="221" font-size="12.5" font-weight="bold" fill="#2272B4" text-anchor="middle">extract_form_fields  (vision LLM)</text>
  <text x="495" y="240" font-size="11" fill="#5B6770" text-anchor="middle">policy no., VIN, estimate &#8230; from the scan</text>

  <rect x="352" y="268" width="286" height="56" rx="8" fill="#FFFFFF" stroke="#2272B4" stroke-width="1.5"/>
  <text x="495" y="291" font-size="12.5" font-weight="bold" fill="#2272B4" text-anchor="middle">analyze_damage_photo  (vision LLM)</text>
  <text x="495" y="310" font-size="11" fill="#985B10" text-anchor="middle">&#9888; skipped for &#8220;express lane&#8221; claims</text>

  <rect x="352" y="338" width="286" height="56" rx="8" fill="#FFFFFF" stroke="#2272B4" stroke-width="1.5"/>
  <text x="495" y="361" font-size="12.5" font-weight="bold" fill="#2272B4" text-anchor="middle">assess_severity  (LLM)</text>
  <text x="495" y="380" font-size="11" fill="#5B6770" text-anchor="middle">minor | moderate | severe</text>

  <rect x="352" y="408" width="286" height="56" rx="8" fill="#1B3139"/>
  <text x="495" y="431" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">route_claim</text>
  <text x="495" y="450" font-size="11" fill="#C7D0D6" text-anchor="middle">fast_track  vs  adjuster_review</text>

  <line x1="495" y1="184" x2="495" y2="198" stroke="#5B6770" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="495" y1="254" x2="495" y2="268" stroke="#5B6770" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="495" y1="324" x2="495" y2="338" stroke="#5B6770" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="495" y1="394" x2="495" y2="408" stroke="#5B6770" stroke-width="1.5" marker-end="url(#arr)"/>

  <line x1="260" y1="169" x2="330" y2="156" stroke="#5B6770" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="260" y1="263" x2="330" y2="226" stroke="#5B6770" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="260" y1="357" x2="330" y2="366" stroke="#5B6770" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Column 3: MLflow -->
  <rect x="730" y="80" width="400" height="440" rx="10" fill="#FFF7F5" stroke="#F1B7AC"/>
  <text x="930" y="110" font-size="15" font-weight="bold" fill="#1B3139" text-anchor="middle">MLflow trace  (3.15+)</text>

  <rect x="752" y="130" width="356" height="110" rx="8" fill="#FFFFFF" stroke="#B9C2C8"/>
  <text x="930" y="155" font-size="12.5" font-weight="bold" fill="#1B3139" text-anchor="middle">Trace &amp; spans  (trace store)</text>
  <text x="930" y="176" font-size="11" fill="#5B6770" text-anchor="middle">inputs, outputs, timings, token usage &#8212;</text>
  <text x="930" y="192" font-size="11" fill="#5B6770" text-anchor="middle">binary content replaced by lightweight refs:</text>
  <text x="930" y="216" font-size="11.5" font-family="Menlo, monospace" fill="#FF3621" text-anchor="middle">mlflow-attachment://&#8230;?content_type=image/jpeg</text>

  <rect x="752" y="260" width="356" height="100" rx="8" fill="#FFFFFF" stroke="#B9C2C8"/>
  <text x="930" y="285" font-size="12.5" font-weight="bold" fill="#1B3139" text-anchor="middle">Attachments  (artifact store)</text>
  <text x="930" y="306" font-size="11" fill="#5B6770" text-anchor="middle">photos and form scans auto-extracted from spans,</text>
  <text x="930" y="322" font-size="11" fill="#5B6770" text-anchor="middle">stored once in S3 / UC volumes &#8212; not inline base64</text>
  <text x="930" y="344" font-size="11" fill="#5B6770" text-anchor="middle">rendered inline in the Trace UI</text>

  <rect x="752" y="380" width="356" height="112" rx="8" fill="#FFFFFF" stroke="#FF3621" stroke-width="1.5"/>
  <text x="930" y="406" font-size="12.5" font-weight="bold" fill="#FF3621" text-anchor="middle">Consumers that can SEE the evidence</text>
  <text x="930" y="430" font-size="11.5" fill="#1B3139" text-anchor="middle">&#8226; humans, in the Trace UI (inline rendering)</text>
  <text x="930" y="452" font-size="11.5" fill="#1B3139" text-anchor="middle">&#8226; vision judges, via get_span_image  (Part 1)</text>
  <text x="930" y="474" font-size="11.5" fill="#1B3139" text-anchor="middle">&#8226; expert reviewers, via review queues  (Part 2)</text>

  <line x1="660" y1="300" x2="730" y2="300" stroke="#FF3621" stroke-width="2" marker-end="url(#arrO)"/>
  <text x="695" y="288" font-size="10.5" fill="#FF3621" text-anchor="middle">autolog</text>
</svg>
