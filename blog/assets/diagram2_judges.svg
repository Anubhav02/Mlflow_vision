<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6770"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3621"/>
    </marker>
  </defs>

  <rect width="1160" height="620" fill="#FFFFFF"/>
  <text x="30" y="42" font-size="22" font-weight="bold" fill="#1B3139">Same trace, two judges: what each one can see</text>

  <!-- Shared trace -->
  <rect x="30" y="200" width="250" height="220" rx="10" fill="#EEF3F8" stroke="#B9C2C8"/>
  <text x="155" y="230" font-size="14" font-weight="bold" fill="#1B3139" text-anchor="middle">Trace: CLM-1004</text>
  <text x="155" y="256" font-size="11.5" fill="#5B6770" text-anchor="middle">description: &#8220;barely a scuff</text>
  <text x="155" y="272" font-size="11.5" fill="#5B6770" text-anchor="middle">on the bumper&#8221;</text>
  <text x="155" y="296" font-size="11.5" fill="#5B6770" text-anchor="middle">output: severity = minor,</text>
  <text x="155" y="312" font-size="11.5" fill="#5B6770" text-anchor="middle">routing = fast_track</text>
  <rect x="52" y="332" width="206" height="66" rx="8" fill="#FFFFFF" stroke="#FF3621" stroke-width="1.5"/>
  <text x="155" y="358" font-size="11.5" font-weight="bold" fill="#FF3621" text-anchor="middle">attachment: damage photo</text>
  <text x="155" y="378" font-size="11" fill="#5B6770" text-anchor="middle">(crushed hood, shattered</text>
  <text x="155" y="392" font-size="11" fill="#5B6770" text-anchor="middle">windshield)</text>

  <!-- Text judge -->
  <rect x="400" y="80" width="440" height="210" rx="10" fill="#F7F7F5" stroke="#DCDCDC"/>
  <text x="620" y="110" font-size="15" font-weight="bold" fill="#1B3139" text-anchor="middle">Text-only judge  ({{ inputs }} / {{ outputs }})</text>
  <text x="620" y="140" font-size="12" fill="#5B6770" text-anchor="middle">Sees only the text: claimant says minor damage,</text>
  <text x="620" y="158" font-size="12" fill="#5B6770" text-anchor="middle">agent says minor damage. Perfectly consistent.</text>
  <rect x="530" y="180" width="180" height="44" rx="22" fill="#DDF2E4" stroke="#3BA65E"/>
  <text x="620" y="208" font-size="15" font-weight="bold" fill="#1F7A3F" text-anchor="middle">PASS &#10003;</text>
  <text x="620" y="252" font-size="11.5" font-style="italic" fill="#985B10" text-anchor="middle">A severe claim just got fast-tracked, and the eval</text>
  <text x="620" y="268" font-size="11.5" font-style="italic" fill="#985B10" text-anchor="middle">suite is green.</text>

  <!-- Vision judge -->
  <rect x="400" y="330" width="440" height="250" rx="10" fill="#FFF7F5" stroke="#F1B7AC"/>
  <text x="620" y="360" font-size="15" font-weight="bold" fill="#1B3139" text-anchor="middle">Vision judge  ({{ trace }} + get_span_image)</text>
  <text x="620" y="388" font-size="12" fill="#5B6770" text-anchor="middle">Agentic judge explores the trace, calls</text>
  <text x="620" y="406" font-size="12" font-family="Menlo, monospace" fill="#FF3621" text-anchor="middle">get_span_image</text>
  <text x="620" y="424" font-size="12" fill="#5B6770" text-anchor="middle">and inspects the actual damage photos.</text>
  <rect x="530" y="442" width="180" height="44" rx="22" fill="#FDE3DE" stroke="#FF3621"/>
  <text x="620" y="470" font-size="15" font-weight="bold" fill="#C22A12" text-anchor="middle">FAIL &#10007;</text>
  <text x="620" y="512" font-size="11.5" font-style="italic" fill="#1B3139" text-anchor="middle">&#8220;&#8230;the actual damage photo reveals SEVERE damage&#8230;</text>
  <text x="620" y="528" font-size="11.5" font-style="italic" fill="#1B3139" text-anchor="middle">a completely shattered windshield with spider-web</text>
  <text x="620" y="544" font-size="11.5" font-style="italic" fill="#1B3139" text-anchor="middle">cracking&#8230; hood crumpling and buckling&#8230;&#8221;</text>

  <!-- Arrows -->
  <line x1="280" y1="270" x2="400" y2="180" stroke="#5B6770" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="330" y="205" font-size="11" fill="#5B6770">text only</text>
  <line x1="280" y1="360" x2="400" y2="440" stroke="#FF3621" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="300" y="420" font-size="11" fill="#FF3621">full trace</text>

  <!-- get_span_image loop -->
  <path d="M 620 330 C 500 320, 300 320, 262 398" stroke="#FF3621" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arrR)"/>
  <text x="430" y="315" font-size="11" fill="#FF3621">fetches image attachments from spans</text>

  <!-- Verdict panel -->
  <rect x="880" y="200" width="250" height="220" rx="10" fill="#FFFFFF" stroke="#B9C2C8"/>
  <text x="1005" y="230" font-size="14" font-weight="bold" fill="#1B3139" text-anchor="middle">Feedback on the trace</text>
  <text x="1005" y="258" font-size="11.5" fill="#5B6770" text-anchor="middle">damage_fidelity_vision: fail</text>
  <text x="1005" y="280" font-size="11.5" fill="#5B6770" text-anchor="middle">process_completeness: fail</text>
  <text x="1005" y="302" font-size="11.5" fill="#5B6770" text-anchor="middle">extraction_accuracy_vision: fail</text>
  <text x="1005" y="330" font-size="11.5" fill="#5B6770" text-anchor="middle">+ image-citing rationales,</text>
  <text x="1005" y="348" font-size="11.5" fill="#5B6770" text-anchor="middle">attached as assessments &#8212;</text>
  <text x="1005" y="366" font-size="11.5" fill="#5B6770" text-anchor="middle">auditable next to the evidence</text>
  <text x="1005" y="384" font-size="11.5" fill="#5B6770" text-anchor="middle">in the Trace UI</text>

  <line x1="840" y1="455" x2="1000" y2="420" stroke="#FF3621" stroke-width="2" marker-end="url(#arrR)"/>
  <line x1="840" y1="200" x2="960" y2="215" stroke="#5B6770" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr2)"/>
</svg>
